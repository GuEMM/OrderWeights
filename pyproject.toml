[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "orderweights"
version = "1.0.0"
description = "Order weights of labeling-symmetric Shannon measures of interdependence"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.11", "matplotlib>=3.8", "pandas>=2.0"]

[tool.setuptools]
packages = ["orderweights"]
